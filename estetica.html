<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#0f5132" />

    <title>Lumé Estética</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 overflow-hidden bg-emerald-950 text-slate-900 antialiased">

    <main class="
      mx-auto
      grid
      h-[100dvh]
      w-full
      max-w-[540px]
      grid-rows-[auto_minmax(0,1fr)_auto]
      gap-3

      bg-gradient-to-b
      from-emerald-50
      via-emerald-100
      to-emerald-200

      px-4
      py-3

      sm:h-[calc(100dvh-24px)]
      sm:rounded-[32px]
      sm:shadow-2xl
    ">

        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <header class="text-center">

            <h1 class="
          font-serif
          text-2xl
          font-medium
          tracking-[0.18em]
          text-emerald-950

          sm:text-3xl
        ">
                LUMÉ
            </h1>

            <p class="
          mt-1
          text-[11px]
          font-semibold
          uppercase
          tracking-[0.28em]
          text-emerald-700
        ">
                Estética & bienestar
            </p>

        </header>



        <!-- ================================================= -->
        <!-- CARRUSEL -->
        <!-- ================================================= -->

        <section id="carousel" aria-label="Galería de estética" class="
        relative
        min-h-0
        touch-pan-y
        overflow-hidden
        rounded-[28px]
        bg-emerald-200

        shadow-[0_18px_45px_rgba(6,78,59,0.22)]
      ">

            <!-- TRACK -->
            <div id="track" class="
          flex
          h-full
          w-full
          transition-transform
          duration-500
          ease-out
        ">


                <!-- ============================================= -->
                <!-- SLIDE 1 -->
                <!-- ============================================= -->

                <article class="relative h-full min-w-full">

                    <img src="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1200&q=85"
                        alt="Tratamiento facial" class="
              block
              h-full
              w-full
              object-cover
            " />

                    <!-- Oscurecido inferior -->
                    <div class="
              pointer-events-none
              absolute
              inset-0
              bg-gradient-to-b
              from-transparent
              via-transparent
              to-black/60
            "></div>


                    <!-- Texto -->
                    <div class="
              absolute
              bottom-12
              left-5
              right-5
              z-10
              text-white
            ">

                        <strong class="
                block
                font-serif
                text-2xl
                font-medium

                sm:text-3xl
              ">
                            Realzá tu belleza
                        </strong>

                        <span class="
                mt-1
                block
                text-sm
                text-white/90
              ">
                            Tratamientos pensados para vos.
                        </span>

                    </div>

                </article>



                <!-- ============================================= -->
                <!-- SLIDE 2 -->
                <!-- ============================================= -->

                <article class="relative h-full min-w-full">

                    <img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=1200&q=85"
                        alt="Espacio de cuidado y bienestar" class="
              block
              h-full
              w-full
              object-cover
            " />

                    <div class="
              pointer-events-none
              absolute
              inset-0
              bg-gradient-to-b
              from-transparent
              via-transparent
              to-black/60
            "></div>


                    <div class="
              absolute
              bottom-12
              left-5
              right-5
              z-10
              text-white
            ">

                        <strong class="
                block
                font-serif
                text-2xl
                font-medium

                sm:text-3xl
              ">
                            Un momento para vos
                        </strong>

                        <span class="
                mt-1
                block
                text-sm
                text-white/90
              ">
                            Cuidado, bienestar y atención personalizada.
                        </span>

                    </div>

                </article>



                <!-- ============================================= -->
                <!-- SLIDE 3 -->
                <!-- ============================================= -->

                <article class="relative h-full min-w-full">

                    <img src="https://images.unsplash.com/photo-1616394584738-fc6e612e71b9?auto=format&fit=crop&w=1200&q=85"
                        alt="Productos y tratamientos de estética" class="
              block
              h-full
              w-full
              object-cover
            " />

                    <div class="
              pointer-events-none
              absolute
              inset-0
              bg-gradient-to-b
              from-transparent
              via-transparent
              to-black/60
            "></div>


                    <div class="
              absolute
              bottom-12
              left-5
              right-5
              z-10
              text-white
            ">

                        <strong class="
                block
                font-serif
                text-2xl
                font-medium

                sm:text-3xl
              ">
                            Cuidate todos los días
                        </strong>

                        <span class="
                mt-1
                block
                text-sm
                text-white/90
              ">
                            Descubrí nuestros servicios y novedades.
                        </span>

                    </div>

                </article>

            </div>



            <!-- ================================================= -->
            <!-- BOTÓN ANTERIOR -->
            <!-- ================================================= -->

            <button id="prevBtn" type="button" aria-label="Imagen anterior" class="
          absolute
          left-3
          top-1/2
          z-20

          grid
          h-10
          w-10

          -translate-y-1/2
          place-items-center

          rounded-full

          bg-black/30
          text-white

          backdrop-blur-md

          transition

          hover:bg-black/45
          active:scale-95
        ">

                <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="m15 18-6-6 6-6" />
                </svg>

            </button>



            <!-- ================================================= -->
            <!-- BOTÓN SIGUIENTE -->
            <!-- ================================================= -->

            <button id="nextBtn" type="button" aria-label="Imagen siguiente" class="
          absolute
          right-3
          top-1/2
          z-20

          grid
          h-10
          w-10

          -translate-y-1/2
          place-items-center

          rounded-full

          bg-black/30
          text-white

          backdrop-blur-md

          transition

          hover:bg-black/45
          active:scale-95
        ">

                <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="m9 18 6-6-6-6" />
                </svg>

            </button>



            <!-- ================================================= -->
            <!-- INDICADORES -->
            <!-- ================================================= -->

            <div id="dots" aria-label="Seleccionar imagen" class="
          absolute
          bottom-4
          left-0
          right-0
          z-20

          flex
          justify-center
          gap-2
        "></div>

        </section>



        <!-- ================================================= -->
        <!-- REDES SOCIALES / ENLACES -->
        <!-- ================================================= -->

        <nav aria-label="Redes sociales y ubicación" class="
    grid
    grid-cols-4
    gap-2
  ">

            <!-- ================================================= -->
            <!-- INSTAGRAM -->
            <!-- ================================================= -->

            <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="
      flex
      min-h-[58px]
      flex-col
      items-center
      justify-center
      gap-1

      rounded-2xl

      bg-gradient-to-r
      from-[#f58529]
      via-[#dd2a7b]
      to-[#8134af]

      px-1

      text-[10px]
      font-bold
      text-white

      shadow-lg

      transition

      hover:brightness-105
      active:scale-[0.97]

      sm:text-xs
    ">

                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.9">
                    <rect x="3" y="3" width="18" height="18" rx="5" />

                    <circle cx="12" cy="12" r="4" />

                    <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                </svg>

                <span>
                    Instagram
                </span>

            </a>


            <!-- ================================================= -->
            <!-- FACEBOOK -->
            <!-- ================================================= -->

            <a href="https://facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="
      flex
      min-h-[58px]
      flex-col
      items-center
      justify-center
      gap-1

      rounded-2xl

      bg-[#1877F2]

      px-1

      text-[10px]
      font-bold
      text-white

      shadow-lg

      transition

      hover:brightness-105
      active:scale-[0.97]

      sm:text-xs
    ">

                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="currentColor">
                    <path d="
          M13.6 21v-8h2.7l.4-3h-3.1V8.1
          c0-.9.3-1.5 1.6-1.5H17V4
          a23 23 0 0 0-2.4-.1
          c-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8h3.1Z
        " />
                </svg>

                <span>
                    Facebook
                </span>

            </a>


            <!-- ================================================= -->
            <!-- TIKTOK -->
            <!-- ================================================= -->

            <a href="https://tiktok.com/" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="
      relative

      flex
      min-h-[58px]
      flex-col
      items-center
      justify-center
      gap-1

      overflow-hidden

      rounded-2xl

      bg-black

      px-1

      text-[10px]
      font-bold
      text-white

      shadow-lg

      transition

      hover:bg-zinc-900
      active:scale-[0.97]

      sm:text-xs
    ">

                <span class="
        absolute
        left-0
        top-0
        h-full
        w-1
        bg-[#25F4EE]
      "></span>

                <span class="
        absolute
        right-0
        top-0
        h-full
        w-1
        bg-[#FE2C55]
      "></span>

                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="currentColor">
                    <path d="
          M15.2 3
          c.3 1.9 1.4 3 3.3 3.1v3
          a8 8 0 0 1-3.3-.8v6.1
          a5.4 5.4 0 1 1-4.7-5.3v3
          a2.4 2.4 0 1 0 1.7 2.3V3h3Z
        " />
                </svg>

                <span>
                    TikTok
                </span>

            </a>


            <!-- ================================================= -->
            <!-- GOOGLE MAPS -->
            <!-- ================================================= -->

            <a href="https://www.google.com/maps/search/?api=1&query=TU+DIRECCION" target="_blank"
                rel="noopener noreferrer" aria-label="Cómo llegar con Google Maps" class="
      flex
      min-h-[58px]
      flex-col
      items-center
      justify-center
      gap-1

      rounded-2xl

      bg-white

      px-1

      text-[10px]
      font-bold
      text-slate-700

      shadow-lg

      ring-1
      ring-black/5

      transition

      hover:bg-slate-50
      active:scale-[0.97]

      sm:text-xs
    ">

                <!-- Ícono estilo Google Maps -->
                <svg viewBox="0 0 24 24" class="h-6 w-6" aria-hidden="true">
                    <path fill="#EA4335" d="
          M12 2
          C7.6 2 4 5.45 4 9.7
          c0 5.8 8 12.3 8 12.3
          s8-6.5 8-12.3
          C20 5.45 16.4 2 12 2Z
        " />

                    <circle cx="12" cy="9.5" r="3" fill="white" />

                    <circle cx="12" cy="9.5" r="1.5" fill="#4285F4" />
                </svg>

                <span>
                    Maps
                </span>

            </a>

        </nav>



        <!-- ================================================= -->
        <!-- JAVASCRIPT CARRUSEL -->
        <!-- ================================================= -->

        <script>

            const track = document.getElementById("track");

            const slides = [
                ...document.querySelectorAll("#track > article")
            ];

            const dotsContainer = document.getElementById("dots");

            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            const carousel = document.getElementById("carousel");


            let current = 0;

            let autoplay;

            let touchStartX = 0;
            let touchEndX = 0;


            // =====================================================
            // CREAR INDICADORES
            // =====================================================

            slides.forEach((_, index) => {

                const dot = document.createElement("button");

                dot.type = "button";

                dot.setAttribute(
                    "aria-label",
                    `Ir a imagen ${index + 1}`
                );

                dot.className = `
        h-2
        w-2
        rounded-full
        bg-white/50
        transition-all
        duration-300
      `;


                dot.addEventListener("click", () => {

                    goTo(index);

                    restartAutoplay();

                });


                dotsContainer.appendChild(dot);

            });


            const dots = [
                ...dotsContainer.children
            ];


            // =====================================================
            // CAMBIAR IMAGEN
            // =====================================================

            function goTo(index) {

                current =
                    (index + slides.length) %
                    slides.length;


                track.style.transform =
                    `translateX(-${current * 100}%)`;


                dots.forEach((dot, index) => {

                    if (index === current) {

                        dot.className = `
            h-2
            w-6
            rounded-full
            bg-white
            transition-all
            duration-300
          `;

                    } else {

                        dot.className = `
            h-2
            w-2
            rounded-full
            bg-white/50
            transition-all
            duration-300
          `;

                    }

                });

            }



            // =====================================================
            // SIGUIENTE
            // =====================================================

            function next() {

                goTo(current + 1);

            }



            // =====================================================
            // ANTERIOR
            // =====================================================

            function prev() {

                goTo(current - 1);

            }



            // =====================================================
            // AUTOPLAY
            // =====================================================

            function startAutoplay() {

                autoplay = setInterval(() => {

                    next();

                }, 4500);

            }



            function restartAutoplay() {

                clearInterval(autoplay);

                startAutoplay();

            }



            // =====================================================
            // BOTONES
            // =====================================================

            nextBtn.addEventListener("click", () => {

                next();

                restartAutoplay();

            });


            prevBtn.addEventListener("click", () => {

                prev();

                restartAutoplay();

            });



            // =====================================================
            // SWIPE MOBILE
            // =====================================================

            carousel.addEventListener(
                "touchstart",
                (event) => {

                    touchStartX =
                        event.changedTouches[0].screenX;

                },
                {
                    passive: true
                }
            );


            carousel.addEventListener(
                "touchend",
                (event) => {

                    touchEndX =
                        event.changedTouches[0].screenX;


                    const distance =
                        touchEndX - touchStartX;


                    if (Math.abs(distance) > 45) {

                        if (distance < 0) {

                            next();

                        } else {

                            prev();

                        }


                        restartAutoplay();

                    }

                },
                {
                    passive: true
                }
            );



            // =====================================================
            // PAUSAR SI EL USUARIO SALE DE LA PESTAÑA
            // =====================================================

            document.addEventListener(
                "visibilitychange",
                () => {

                    if (document.hidden) {

                        clearInterval(autoplay);

                    } else {

                        restartAutoplay();

                    }

                }
            );



            // =====================================================
            // INICIO
            // =====================================================

            goTo(0);

            startAutoplay();

        </script>

</body>

</html>
